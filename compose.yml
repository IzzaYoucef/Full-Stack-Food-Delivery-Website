services:
  db:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      MONGODB_URI: mongodb://db:27017/food-delivery
    volumes:
      - uploads_data:/app/uploads

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://localhost:4000

  admin:
    image: node:24-alpine
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5174:5173"
    environment:
      VITE_BACKEND_URL: http://localhost:4000
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  mongo_data:
  uploads_data:
  admin_node_modules:
